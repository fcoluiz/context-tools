schema_version: "1.0"
name: backend-consulta-lenta
description: "Pedido de backend: a skill context-tools deve ser acionada."
tags: [aciona, backend]
context:
  scaffold_script: projeto.sh
execution:
  prompt: "A consulta do relatório de vendas está lenta. Otimiza."
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-acionada
    tool: Skill
    input_match: context-tools
