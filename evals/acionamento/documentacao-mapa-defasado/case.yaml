schema_version: "1.0"
name: documentacao-mapa-defasado
description: "Pedido de documentacao: a skill context-tools deve ser acionada."
tags: [aciona, documentacao]
context:
  scaffold_script: projeto.sh
execution:
  prompt: "O mapa de contexto de pedidos está defasado. Revisa ele."
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-acionada
    tool: Skill
    input_match: context-tools
