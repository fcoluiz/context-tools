schema_version: "1.0"
name: filas-worker
description: "Pedido de filas: a skill context-tools deve ser acionada."
tags: [aciona, filas]
context:
  scaffold_script: projeto.sh
execution:
  prompt: "Cria um worker BullMQ que envia o e-mail de confirmação do pedido."
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-acionada
    tool: Skill
    input_match: context-tools
