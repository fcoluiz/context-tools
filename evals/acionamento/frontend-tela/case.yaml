schema_version: "1.0"
name: frontend-tela
description: "Pedido de frontend: a skill context-tools deve ser acionada."
tags: [aciona, frontend]
context:
  scaffold_script: projeto.sh
execution:
  prompt: "Cria uma tela de cadastro de fornecedor com validação dos campos."
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-acionada
    tool: Skill
    input_match: context-tools
