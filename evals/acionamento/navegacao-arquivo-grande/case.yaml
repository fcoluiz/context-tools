schema_version: "1.0"
name: navegacao-arquivo-grande
description: "Pedido de navegacao: a skill context-tools deve ser acionada."
tags: [aciona, navegacao]
context:
  scaffold_script: projeto.sh
execution:
  prompt: "O arquivo src/legacy/Relatorios.pas tem 4.000 linhas. Acha onde fica o cálculo do imposto."
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-acionada
    tool: Skill
    input_match: context-tools
