schema_version: "1.0"
name: revisao-auditar
description: "Pedido de revisao: a skill context-tools deve ser acionada."
tags: [aciona, revisao]
context:
  scaffold_script: projeto.sh
execution:
  prompt: "Audita este projeto e me diz os principais riscos."
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-acionada
    tool: Skill
    input_match: context-tools
