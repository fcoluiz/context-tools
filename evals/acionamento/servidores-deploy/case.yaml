schema_version: "1.0"
name: servidores-deploy
description: "Pedido de servidores: a skill context-tools deve ser acionada."
tags: [aciona, servidores]
context:
  scaffold_script: projeto.sh
execution:
  prompt: "Configura o deploy pelo GitHub Actions com health check depois de subir."
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-acionada
    tool: Skill
    input_match: context-tools
